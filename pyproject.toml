[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-cosmology"
version = "0.1.0"
description = "Exact finite research tools for the Omega Cosmology program"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[project.optional-dependencies]
testbed = ["numpy>=1.26", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]
